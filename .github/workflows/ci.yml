name: CI

# Pull requests are tested as they are, and pushes only when they land on main: a push to a pull request's branch
# would otherwise run everything twice. A release tag is left to the Release workflow, since it's only put on a
# commit that has passed here already. A change only to the docs runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job keeps a build cache of its own, as setup-go's is shared by every job on a system and saved only when
# go.sum changes, so it seldom holds what a job compiles. Jobs restore the newest saved from main, and runs on main
# save theirs.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CACHE_KEY: go-test-${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go.outputs.cache }}
            ${{ steps.go.outputs.modcache }}
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ env.CACHE_KEY }}-
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Known vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Licence notices are current
        if: matrix.os == 'ubuntu-latest'
        run: sh scripts/notices.sh && git diff --exit-code THIRD_PARTY_NOTICES
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go.outputs.cache }}
            ${{ steps.go.outputs.modcache }}
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}

  build:
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { runs-on: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { runs-on: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
          - { runs-on: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0" }
          # Listing serial ports on macOS goes through IOKit, so its builds need cgo and a Mac.
          - { runs-on: macos-latest, goos: darwin, goarch: arm64, cgo: "1" }
          - { runs-on: macos-latest, goos: darwin, goarch: amd64, cgo: "1" }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CACHE_KEY: go-build-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go.outputs.cache }}
            ${{ steps.go.outputs.modcache }}
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ env.CACHE_KEY }}-
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags="-s -w" -o meshcore-tui-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/meshcore-tui
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go.outputs.cache }}
            ${{ steps.go.outputs.modcache }}
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
